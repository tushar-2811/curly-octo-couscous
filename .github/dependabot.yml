version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions that are at least 3 days old. This is stricter than the
    # 1-day minimumReleaseAge in pnpm-workspace.yaml, so Dependabot never proposes a
    # version that pnpm would refuse to install.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      temporal:
        patterns: ['@temporalio/*']
      opentelemetry:
        patterns: ['@opentelemetry/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', '@next/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
