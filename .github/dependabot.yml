version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      temporal:
        patterns: ['@temporalio/*']
      opentelemetry:
        patterns: ['@opentelemetry/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', '@next/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
