# Local dependencies for machines with Docker. `pnpm dev` uses this when Docker is
# available, otherwise it runs Postgres and Temporal from local binaries (Homebrew).
name: ai-workforce

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ai_workforce
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:1.10.1
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db']
    ports:
      - '7233:7233'
      - '8233:8233'
    volumes:
      - temporal-data:/data

volumes:
  postgres-data:
  temporal-data:
