packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@swc/core'
  - '@temporalio/core-bridge'
  - esbuild
  - sharp
  - unrs-resolver

# Supply-chain guard: never resolve a package version published less than 1 day ago
# (most malicious releases are caught and pulled within hours). Explicit so local
# installs, CI and Dependabot all follow the same rule.
minimumReleaseAge: 1440
